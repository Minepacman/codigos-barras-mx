name: Validar contribuciones

on:
  pull_request:
    paths:
      - "extra/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validar.yml"
  push:
    branches: [main]
    paths:
      - "extra/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Validar extra/manual.csv (dígito de control, columnas, categorías, duplicados)
        run: python scripts/validar_manual.py extra/manual.csv

      - name: Generar el catálogo con el manual en seco (sin descargar nada)
        run: |
          # Comprueba que el manual se combina sin errores con el catálogo ya versionado.
          python - <<'EOF'
          import csv, sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from catalogo import catalogo
          manual = catalogo.leer_manual(Path("extra/manual.csv").read_text(encoding="utf-8"))
          with open("datos/catalogo-mx.csv", encoding="utf-8") as f:
              filas = list(csv.DictReader(f))
          final = catalogo.combinar(filas + manual)
          print(f"{len(manual)} manuales + {len(filas)} del catálogo → {len(final)} productos")
          EOF
